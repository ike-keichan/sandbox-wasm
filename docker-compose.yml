services:
  app:
    build: .
    # 手元のパソコンと同じユーザーで動かす。番号は、Makefile が調べて渡す。
    # root で動かすと、Linux では、変換で作った .wasm などが root の持ち物になり、手元で消せなくなる。
    # 決まったユーザー（node など）で動かすと、手元のユーザーと番号が違うときに、ファイルを書き込めない。
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
